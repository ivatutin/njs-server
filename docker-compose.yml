services:
  postgres:
    # Пин патча PostgreSQL 16 — воспроизводимость важнее автообновления
    image: postgres:16.15-alpine
    container_name: app-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    # Valkey 8 — drop-in форк Redis 7.2 под OSS-лицензией; клиент ioredis совместим,
    # имена env-переменных REDIS_* и имя сервиса не меняем
    image: valkey/valkey:8-alpine
    container_name: app-redis
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      # Хост-порт переопределяется, если 6379 занят (например, другим проектом):
      #   REDIS_HOST_PORT=6380 docker compose up -d
      # Внутри compose-сети приложение ходит на redis:6379 независимо от маппинга
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  keycloak:
    # Образ собирается локально: build step (kc.sh build) обязателен для
    # `start --optimized` в docker-compose.prod.yml
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
      args:
        # Переопределяемо, если CDN quay.io недоступен из вашей сети:
        #   KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.0
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0}
    image: app-keycloak:26.8.0
    container_name: app-keycloak
    command: start-dev
    environment:
      # Keycloak 26: bootstrap-админ задаётся через KC_BOOTSTRAP_ADMIN_*
      # (KEYCLOAK_ADMIN* удалены), но имена наших .env-переменных не меняем
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Heap = 70% от mem_limit контейнера: фиксируем явно, чтобы политика
      # была видна здесь, а не только в дефолтах образа
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=70"
    mem_limit: 1g
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready на management-порту 9000 (Keycloak 25+). Только bash-builtins
      # (/dev/tcp, read, [[ ]]) — в hardened-образе нет curl/wget
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          read -r -t 5 status <&3 &&
          [[ "$$status" == *200* ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-backend
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}?schema=public
      REDIS_HOST: redis
      # Внутри compose-сети порт контейнера всегда 6379; хост-маппинг
      # (${REDIS_HOST_PORT}) влияет только на доступ с хоста. Фиксируем явно,
      # чтобы локальный REDIS_PORT из .env не протекал в контейнер
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pg-data:
  redis-data:

networks:
  app-network:
    driver: bridge
