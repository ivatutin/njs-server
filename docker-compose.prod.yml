# Production overrides. Apply with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    # В проде не выставляем порт наружу — доступ только из app-network
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  keycloak:
    restart: always
    # Образ уже прошёл build step (docker/keycloak/Dockerfile) — только поэтому
    # `start --optimized` валиден: Keycloak стартует без пересборки конфигурации
    command: ["start", "--optimized"]
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      # Канал аутентификации CIBA (ADR-0015) — внутренний адрес приложения
      KC_SPI_CIBA_AUTH_CHANNEL__CIBA_HTTP_AUTH_CHANNEL__HTTP_AUTHENTICATION_CHANNEL_URI: ${CIBA_CHANNEL_URL:-http://app-backend:${APP_PORT:-3001}/${APP_PATH_PREFIX:-api/v1}/internal/ciba/channel}

  app:
    restart: always
    environment:
      # Токены подписаны публичным адресом Keycloak (KC_HOSTNAME), поэтому и
      # ожидаемый issuer — публичный, хотя звоним мы по внутреннему KEYCLOAK_URL
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://${KC_HOSTNAME:-localhost}/realms/${KEYCLOAK_REALM:-app}}
    # Используем готовый образ из registry (GHCR), не build
    # image: ghcr.io/${GITHUB_REPOSITORY:-ivatutin/njs-server}:latest
    # build: !reset null
